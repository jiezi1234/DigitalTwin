[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaltwin-refactor"
version = "0.1.0"
description = "Persona dialogue and multimodal PDF RAG system"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "langchain>=0.1.0",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.1.0",
    "chromadb>=0.4.0",
    "dashscope>=1.10.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.23.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-otlp-proto-http>=1.21.0",
    "opentelemetry-exporter-prometheus>=0.42b0",
    "prometheus-client>=0.19.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[project.scripts]
digitaltwin-server = "src.cli.run_server:main"
digitaltwin-import = "src.cli.import_wechat_csv:main"
digitaltwin-export-pdf = "src.cli.export_pdf_assets:main"
digitaltwin-rebuild-mm-pdf = "src.cli.rebuild_multimodal_pdf_index:main"
digitaltwin-import-course-materials = "src.cli.import_course_materials:main"
digitaltwin-evaluate-retrieval = "src.cli.evaluate_retrieval:main"
digitaltwin-evaluate-answers = "src.cli.evaluate_answers:main"
digitaltwin-calibrate-evidence = "src.cli.calibrate_evidence:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra"
